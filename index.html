  <div id="splash99" aria-hidden="true">
    <div class="splash99-scene">
      <svg id="splash99Cat" class="splash99-cat" width="77" height="84" viewBox="0 0 77 84" aria-hidden="true"></svg>

  <script>
  (function () {
    try {
      if (sessionStorage.getItem('splash99_skipped')) { var _s = document.getElementById('splash99'); if (_s) _s.parentNode.removeChild(_s); return; }
      sessionStorage.setItem('splash99_skipped', '1');
      // 像素画数据（'.' = 空）：小猫两帧舔爪 + 男主人坐姿
      var CAT_A = [ // 帧 A：右爪抬起 + 伸舌舔
        '.EE.....EE.','.EPE...EPE.','.WWWWWWWWW.','WWWWWWWWWWW','WWmWWWWWmWW','WWWWWnWWWWW',
        'WWWWWWWWPPW','WWWWWttPPPW','WWWWWWWWWWW','WW.WWWWW.WW','WW.WWWWW.WW','...WWWWW...'];
      var CAT_B = [ // 帧 B：爪放下 · 休息
        '.EE.....EE.','.EPE...EPE.','.WWWWWWWWW.','WWWWWWWWWWW','WWmWWWWWmWW','WWWWWnWWWWW',
        'WWWWWWWWWWW','WWWWWWWWWWW','WWWWWWWWWWW','WW.WWWWW.WW','WW.WWWWW.WW','...WWWWW...'];
      var MAN = [ // 男主人坐姿（teal 上衣 · 呼应 App 主题色与磨砂玻璃小银猫图标）
        '....HHHH....','....HHHH....','....FFFF....','....FFFF....','.....FF.....',
        '..CCCCCCCC..','.CCCCCCCCCC.','.CCeCCCCeCC.','..CCCCCCCC..','..CCCCCCCC..',
        '..KKKKKKKK..','..KK....KK..','..XX....XX..'];
      var COLORS = { W:'#f2f7fa', E:'#d9e6ec', P:'#f4c2d8', m:'#46626e', n:'#e38ba8', t:'#f9a8d4',
        H:'#45586a', F:'#f0c9a8', C:'#0f766e', e:'#2b4450', K:'#3b4c5e', X:'#22303d' };
      var PX = 7;
      function draw(art) {
        var s = '';
        for (var r = 0; r < art.length; r++) {
          var row = art[r];
          for (var c = 0; c < row.length; c++) {
            var ch = row[c];
            if (ch === '.') continue;
            s += '<rect x="' + (c * PX) + '" y="' + (r * PX) + '" width="' + PX + '" height="' + PX + '" fill="' + (COLORS[ch] || COLORS.W) + '" rx="1"/>';
          }
        }
        return s;
      }
      var cat = document.getElementById('splash99Cat');
      if (cat) cat.innerHTML =
        '<g class="cat-lick-a">' + draw(CAT_A) + '</g>' +
        '<g class="cat-lick-b">' + draw(CAT_B) + '</g>';
      var man = document.getElementById('splash99Man');
      if (man) man.innerHTML = draw(MAN);
      // 舔爪循环（450ms/帧）
      var lick = setInterval(function () { if (cat) cat.classList.toggle('lick-b'); }, 450);
      // 2s 开屏动画结束淡出；点击跳过
      var splash = document.getElementById('splash99');
      var gone = false;
      function dismiss() {
        if (gone) return; gone = true;
        if (splash) splash.classList.add('splash99-out');
        setTimeout(function () {
          clearInterval(lick);
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 600);
      }
      var t = setTimeout(dismiss, 2000);
      if (splash) splash.addEventListener('click', function () { clearTimeout(t); dismiss(); });
    } catch (e) {}
  })();
  </script>

  <script>
    // v2026.0905c 手机端崩溃修复②：load 后检查——核心模块缺失时全屏遮罩 + 一键重试，
    // 不再让"半启动"的 App 进入可用状态（点进对应板块才崩 = 用户看到的"先用后崩"）
    (function () {
      var FATAL = /\/js\/(app\/|data\.js|storage\.js)/; // 缺这些 = 应用残废；sanguo.js 仅影响三国杀，不致命
      window.addEventListener('load', function () {
        setTimeout(function () {
          var bad = window.__bootFailedScripts || [];
          var appOk = (typeof App !== 'undefined' && typeof Store !== 'undefined');
          if (!bad.length && appOk) return;
          // 缺 js/app/*、js/data.js、js/storage.js = 应用残废（必须拦）；sanguo.js 仅影响三国杀（不阻断）
          var fatal = !appOk || bad.some(function (f) { return FATAL.test(f); });
          if (!fatal) { console.warn('[boot] 非核心脚本缺失（不阻断）：', bad.join('、')); return; }
          var ov = document.createElement('div');
          ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.78);z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:18px;';
          var box = document.createElement('div');
          box.style.cssText = 'max-width:520px;width:100%;max-height:86vh;overflow:auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 20px 50px rgba(2,6,23,.35);font-size:14px;line-height:1.8;color:#0f172a;';
          box.innerHTML =
            '<div style="font-size:17px;font-weight:800;color:#dc2626;margin-bottom:8px">❌ 应用文件加载不完整</div>' +
            '<div style="margin-bottom:6px">未能加载的文件：<b style="color:#b45309">' + (bad.length ? bad.join('、') : '未知（可能整个 js/app/ 目录缺失）') + '</b></div>' +
            '<div style="font-size:12.5px;color:#64748b;margin-bottom:10px">现在启动会是"半残"状态——部分板块点进去会崩溃，所以先拦下来。</div>' +
            '<div style="border-top:1px solid #e2e8f0;padding-top:10px;font-size:12.5px;color:#475569">' +
            '1️⃣ 网络抖动：点下方「重新加载」即可；<br>' +
            '2️⃣ 部署/拷贝漏文件：请上传<b>完整项目文件夹</b>（尤其是 js/app/ 目录及其 30 个文件）；<br>' +
            '3️⃣ 旧缓存作怪：强制刷新页面或清除该站点缓存后重开；<br>' +
            '4️⃣ 应急使用：打开「生命征程-单文件版.html」（全部代码内联，不依赖任何外部文件）。' +
            '</div>' +
            '<button id="__bootRetry" style="margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:#0d9488;color:#fff;font-size:15px;font-weight:700;cursor:pointer">🔄 重新加载</button>';
          ov.appendChild(box);
          document.body.appendChild(ov);
          document.getElementById('__bootRetry').onclick = function () { location.reload(); };
        }, 600);
      });
    })();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('SW 注册失败:', e);
        });
      });
    }
  </script>
